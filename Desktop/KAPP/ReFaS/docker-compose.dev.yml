services:

  db:
    image: postgres:15
    container_name: farm_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farm_net

  redis:
    image: redis:7
    container_name: farm_redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - farm_net

  api:
    build:
      context: ./services/api
    container_name: farm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api:/app
      - ./services/ai:/shared/services/ai:ro
    environment:
      AI_ASSETS_ROOT: /shared/services/ai
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "${API_PORT:-8002}:8000"
    networks:
      - farm_net

  worker:
    build:
      context: ./services/worker
    command: python app/main.py
    volumes:
      - ./services:/services
      - ./services/worker:/worker
    environment:
      PYTHONPATH: /services
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - farm_net

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - farm_net
  data-extractor:
    build:
      context: ./services/data-extractor
    command: python app/main.py
    volumes:
      - ./services/data-extractor:/extractor
      - ./services/api:/services/api
      - ./services/ai:/shared/services/ai:ro
    environment:
      AI_ASSETS_ROOT: /shared/services/ai
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - farm_net

  realtime:
    build:
      context: ./services/realtime
    container_name: farm_realtime
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/realtime:/app
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "${REALTIME_PORT:-8003}:8001"
    networks:
      - farm_net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: farm_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - realtime
    networks:
      - farm_net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: farm_alertmanager
    restart: always
    volumes:
      - ./infrastructure/monitoring/alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - farm_net

  qdrant:
      image: qdrant/qdrant:latest
      container_name: farm_qdrant
      restart: always
      ports:
        - "6333:6333"
      networks:
        - farm_net

  flowise:
      image: flowiseai/flowise:latest
      container_name: farm_flowise
      restart: always
      ports:
        - "3000:3000"
      networks:
        - farm_net
  grafana:
    image: grafana/grafana:11.2.0
    container_name: farm_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - farm_net

volumes:
  postgres_data:
  grafana_data:

networks:
  farm_net:
