global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets: ["realtime:8001"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9102"]
