name: Architecture Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pr-fast-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch main for diff
        run: git fetch origin main --depth=1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Run ESLint on changed TS files
        shell: bash
        run: |
          CHANGED_TS_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx)$' || true)
          if [ -z "$CHANGED_TS_FILES" ]; then
            echo "No changed TypeScript files detected."
            exit 0
          fi
          pnpm eslint $CHANGED_TS_FILES

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Import Linter
        env:
          PYTHONPATH: services/api
        run: lint-imports --config .importlinter

  main-full-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Run ESLint on full repo
        run: pnpm eslint .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Import Linter
        env:
          PYTHONPATH: services/api
        run: lint-imports --config .importlinter
